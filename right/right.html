<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Right skyscraper</title>
  <link rel="stylesheet" href="../reset.css">
  <link rel="stylesheet" href="right.css">
</head>

<body>
  <main class="ad ad--right">
    <a class="ad__link" href="https://example.com/landing" target="_blank" rel="noopener noreferrer">
      <img class="ad__layer ad__layer--background" src="../assets/right/bg.jpg" width="320" height="975" alt="">
      <img class="ad__layer ad__layer--logo" src="../assets/right/logo.png" width="320" height="975" alt="Your logo">
      <img class="ad__layer ad__layer--box" src="../assets/box.png" width="320" height="975" alt="">
      <img class="ad__layer ad__layer--copy" src="../assets/right/hl.png" width="320" height="975"
        alt="Bildet einen beruhigenden Schutzfilm.">
      <span class="ad__cta">
        <img class="ad__layer ad__layer--cta" src="../assets/cta.png" alt="Jetzt entdecken">
      </span>
    </a>
  </main>
  <script src="../lib/gsap.min.js"></script>
  <script src="right.js"></script>
</body>

</html>
