<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Fireplace Ad: animated 320 by 975 pixel left skyscraper for a cough and cold campaign.">
  <title>Left skyscraper</title>
  <link rel="stylesheet" href="../reset.css">
  <link rel="stylesheet" href="left.css">
</head>

<body>
  <main class="ad ad--left">
    <a class="ad__link" href="https://example.com/landing" target="_blank" rel="noopener noreferrer">
      <img class="ad__layer ad__layer--background" src="../assets/left/bg.jpg" width="320" height="975" alt="">
      <img class="ad__layer ad__layer--logo" src="../assets/left/logo.png" width="320" height="975" alt="Your logo">
      <img class="ad__layer ad__layer--box" src="../assets/box.png" width="320" height="975" alt="">
      <img class="ad__layer ad__layer--copy" src="../assets/left/hl.png" width="320" height="975"
        alt="Beruhigt effektiv bei trockenem Reizhusten.">
      <span class="ad__cta">
        <img class="ad__layer ad__layer--cta" src="../assets/cta.png" alt="Jetzt entdecken">
      </span>
    </a>
  </main>
  <script src="../lib/gsap.min.js"></script>
  <script src="left.js"></script>
</body>

</html>
